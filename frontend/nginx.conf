# Search engines list only the main site (finstap.com); company workspaces (acme.finstap.com) are private logins
map $host $robots_tag {
    ~*^finstap\.com$ "";
    default          "noindex, nofollow";
}

server {
    listen 80;
    server_name localhost;

    # One address for Google: www.finstap.com → finstap.com
    if ($host = www.finstap.com) {
        return 301 https://finstap.com$request_uri;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        if ($robots_tag = "") {
            return 200 "User-agent: *\nAllow: /\nSitemap: https://finstap.com/sitemap.xml\n";
        }
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The API builds the sitemap with every published blog post; if it cannot be reached the
    # built-in public/sitemap.xml (main pages only) is served instead
    location = /sitemap.xml {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $sitemap_api https://api.finstap.com/api/platform/sitemap.xml;
        proxy_pass $sitemap_api;
        proxy_set_header Host api.finstap.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.finstap.com;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @static_sitemap;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=900" always;
    }

    location @static_sitemap {
        root /usr/share/nginx/html;
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=900" always;
    }

    # ── Gzip Compression ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ── Security Headers ───────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Frontend SPA (React) ────────────────────────────────────────
    # VITE_API_URL is baked into the JS bundle as an absolute URL
    # (https://api.brixenconsultants.com/api) — no /api/ proxy needed here.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # The page itself is checked on every visit, so a new deploy shows up straight away
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
    }

    # Built files have a content hash in their name, so browsers keep them for a year and
    # repeat visits download nothing (a deploy gives changed files new names)
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
