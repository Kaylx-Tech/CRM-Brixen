<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var isApple = /Mac|iPhone|iPod|iPad/i.test(navigator.userAgentData?.platform || navigator.platform || navigator.userAgent || '');
          if (isApple) {
            document.documentElement.classList.add('is-apple');
          } else {
            document.documentElement.classList.add('is-non-apple');
          }
        } catch (e) {
          document.documentElement.classList.add('is-non-apple');
        }
      })();
    </script>
    <title>ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
