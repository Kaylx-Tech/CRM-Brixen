<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var isApple = /Mac|iPhone|iPod|iPad/i.test(navigator.userAgentData?.platform || navigator.platform || navigator.userAgent || '');
          if (isApple) {
            document.documentElement.classList.add('is-apple');
          } else {
            document.documentElement.classList.add('is-non-apple');
          }
        } catch (e) {
          document.documentElement.classList.add('is-non-apple');
        }
      })();
    </script>
    <script>
      // The theme before the app loads, so a dark page never shows white first (same rules as hooks/theme-provider.jsx)
      (function () {
        try {
          var path = location.pathname;
          var lightOnly = /^\/(login|forgot-password|reset-password|signup)(\/|$)/.test(path);
          var theme = localStorage.getItem('vite-ui-theme') || 'light';
          if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (lightOnly || (theme !== 'dark' && theme !== 'light')) theme = 'light';
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
    <title>Brixen Consultants - Corporate CMS & Client Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
