services:
  brixen-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brixen-api
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:5050"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5050
      - CRM_ENV=production
      - DATABASE_URL=/app/data/hypetex.db
      - STORAGE_PATH=/app/storage
      - DEV_AUTH_BYPASS=0
      - COOKIE_SECURE=true
      - FRONTEND_URL=${FRONTEND_URL:-https://admin.brixenconsultants.com}
      - PORTAL_URL=${PORTAL_URL:-https://portal.brixenconsultants.com}
    volumes:
      # Host live DB → app data folder (single file mount)
      - /var/www/brixen-crm/hypetex.db:/app/data/hypetex.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5050/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
